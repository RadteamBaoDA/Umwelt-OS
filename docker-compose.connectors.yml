# Legacy connectors overlay: n8n plus (via include) the browser overlay, so the existing command keeps both.
# include needs Docker Compose >= 2.20. n8n-only or browser-only: use docker-compose.browser.yml directly.
# N8N_* and CONNECTOR_CREDENTIAL_ENCRYPTION_KEY reach api/worker through env_file: .env in docker-compose.yml.
include:
  - docker-compose.browser.yml

services:
  n8n:
    build:
      context: .
      dockerfile: infrastructure/docker/n8n-connectors.Dockerfile
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      CONNECTOR_API_IP: 172.29.250.10
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    cap_add: ["NET_ADMIN"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    networks:
      - connectors_internal
      - n8n_egress
    restart: unless-stopped

volumes:
  n8n-data:

networks:
  n8n_egress:
    driver: bridge
