# Legacy connectors overlay: n8n plus (via include) the browser overlay, so the existing command keeps both.
# include needs Docker Compose >= 2.20. n8n-only or browser-only: use docker-compose.browser.yml directly.
# N8N_* and CONNECTOR_CREDENTIAL_ENCRYPTION_KEY reach api/worker through env_file: .env in docker-compose.yml.
include:
  - docker-compose.browser.yml

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  n8n:
    build:
      context: .
      dockerfile: infrastructure/docker/n8n-connectors.Dockerfile
    environment:
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY (make setup generates it)}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      CONNECTOR_API_IP: 172.29.250.10
      # Code nodes must not read container env (encryption key etc.).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Set these when n8n is served from a hostname; defaults suit loopback-only use.
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    # NET_ADMIN only for the entrypoint's iptables rules; SETUID/SETGID for su-exec. The n8n process runs as
    # `node` with no capabilities. Never publish 5678 beyond loopback (see docs/deployment.md).
    cap_drop: [ALL]
    cap_add: ["NET_ADMIN", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    networks:
      - connectors_internal
      - n8n_egress
    restart: unless-stopped

volumes:
  n8n-data:

networks:
  n8n_egress:
    driver: bridge
