[project]
name = "bbd-os"
version = "0.1.0"
description = "Self-hosted personal intelligence OS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "arq>=0.27,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pypdf>=6,<7",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.2,<2",
    "redis>=5,<6",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "structlog>=25,<26",
    "tiktoken>=0.12,<1",
    "uvicorn[standard]>=0.35,<1",
    "authlib>=1.6,<2",
    "itsdangerous>=2.2,<3",
    "openai>=2.20,<3",
    "cryptography>=50,<51",
    "graphiti-core[falkordb]==0.30.2",
    "falkordb==1.2.0",
    "neo4j==5.28.3",
    "pytz==2026.4",
    "numpy==2.5.3",
    "tenacity==9.1.4",
    "posthog==7.61.1",
    "backoff==2.2.1",
    "python-dateutil==2.9.0.post0",
    "jsonschema>=4.23,<5",
    "httpx2==2.13.1",
    "mcp==2.3.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.1.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]==3.3.3",
    "psycopg-pool==3.3.0",
]

[dependency-groups]
browser = [
    "beautifulsoup4>=4.13,<5",
    "crawlee[beautifulsoup,playwright]>=1,<2",
]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL and Redis services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
packages = ["core", "apps", "modules"]
plugins = ["pydantic.mypy"]
