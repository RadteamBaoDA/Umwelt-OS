[project]
name = "umwelt-os"
version = "0.1.0"
description = "Self-hosted personal intelligence OS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "arq>=0.27,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pglast>=7,<9",
    "pypdf>=6.21.4,<7",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.2,<2",
    "redis>=5,<6",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "tiktoken>=0.12,<1",
    "uvicorn[standard]>=0.35,<1",
    "authlib>=1.9.1,<2",
    "itsdangerous>=2.2,<3",
    "openai>=2.20,<3",
    "cryptography>=50,<51",
    "graphiti-core==0.30.2",
    "neo4j==5.28.3",
    "jsonschema>=4.23,<5",
    "httpx2==2.13.1",
    "mcp==2.3.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint>=4.3.0,<5",
    "langgraph-checkpoint-postgres==3.1.3",
    "psycopg[binary]==3.3.3",
    "psycopg-pool==3.3.0",
    "prometheus-client>=0.21,<1",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0,<1",
    "opentelemetry-instrumentation-httpx>=0.66b0,<1",
    "opentelemetry-instrumentation-redis>=0.66b0,<1",
    "ofxtools>=0.9,<1",
    "aioboto3>=15,<16",
]

[tool.uv]
# Transitive pins (graphiti-core / neo4j / posthog): versions are held here without making them direct dependencies.
constraint-dependencies = [
    "pytz==2026.4",
    "numpy==2.5.3",
    "tenacity==9.1.4",
    "posthog==7.61.1",
    "backoff==2.2.1",
]

[dependency-groups]
browser = [
    "beautifulsoup4>=4.13,<5",
    "crawlee[beautifulsoup,playwright]>=1,<2",
]
dev = [
    "import-linter>=2.3,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "moto[server]>=5,<6",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
faulthandler_timeout = 300
testpaths = ["tests"]
markers = [
    "integration: requires disposable PostgreSQL and Redis services",
    "benchmark: opt-in micro-benchmarks, run with RUN_BENCHMARKS=1 (tests/benchmarks)",
]

[tool.coverage.run]
# Branch coverage: line-only totals hide untested else/except arms (floor in .github/workflows/ci.yml).
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored agent skills (third-party example scripts) are not application code.
extend-exclude = [".claude", ".agents"]

[tool.ruff.lint]
# Quality gate (plan 3.3 R0). Rule families and why they are on:
#   E/F/W  pycodestyle + pyflakes basics        I     import ordering (deterministic diffs)
#   B      bugbear (real bug patterns)          UP    modern syntax for the py312 target
#   C90    mccabe complexity (<= 15)            PLR0912/PLR0915  branch and statement budgets
#   BLE    no blind `except Exception` swallowing without a justification
#   S      bandit security checks               ASYNC blocking calls inside coroutines
#   RUF100 every `# noqa` must still suppress something
select = ["E", "F", "W", "I", "B", "UP", "C90", "PLR0912", "PLR0915", "BLE", "S", "ASYNC", "RUF100"]
# E501: code is formatted by `ruff format` (gated by `ruff format --check`), but the formatter does
# not wrap long strings, docstrings or comments, so E501 would flag ~12k prose lines with no quality
# gain; function length (scripts/check_function_length.py) and complexity gate maintainability.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# Asserts are the pytest idiom; S101 is only meaningful in production code.
# S105/S106/S107: test fixtures use fictional literal credentials ("secret", "token") by design.
"tests/**" = ["S101", "S105", "S106", "S107"]
# Frozen initial migration: W291 hits trailing spaces inside multi-line SQL string literals,
# which must not be edited (historical revision text, ancestry and behaviour stay unchanged).
"infrastructure/postgres/migrations/versions/0001_init.py" = ["W291"]
# Owner-run dev tool: every subprocess is a fixed-argument docker/git call resolved from PATH (no shell, no
# untrusted input), so S603/S607 are noise. C901/PLR0912: _verify_target is a linear sequence of ownership
# checks that reads worse when split.
"scripts/dev_workspace.py" = ["S603", "S607", "C901", "PLR0912"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
packages = ["core", "apps", "modules"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# aioboto3/botocore ship no type information; the S3 backend isolates them behind core.storage.s3.
module = ["aioboto3", "aioboto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
