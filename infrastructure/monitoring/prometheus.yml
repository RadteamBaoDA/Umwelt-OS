# Prometheus scrape configuration for the optional `monitoring` compose profile.
# Targets are compose service names on the project network; none of them is published to the host.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: umwelt-api
    metrics_path: /metrics
    # Same value as METRICS_TOKEN in the API's .env; mounted as a compose secret (see docker-compose.monitoring.yml).
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
        labels: {process: api}

  # Workers serve /metrics on METRICS_WORKER_PORT (+0 worker, +1 chat-worker, +2 model-worker, +3 cron-worker) inside the
  # compose network only. The overlay sets METRICS_WORKER_PORT=9100 and METRICS_WORKER_BIND=0.0.0.0.
  - job_name: umwelt-worker
    static_configs:
      - targets: ["worker:9100"]
        labels: {process: worker}
      - targets: ["chat-worker:9101"]
        labels: {process: chat-worker}
      - targets: ["model-worker:9102"]
        labels: {process: model-worker}
      - targets: ["cron-worker:9103"]
        labels: {process: cron-worker}
