services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: bbd
      POSTGRES_USER: bbd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup to create .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbd -d bbd"]
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
    shm_size: 1gb
    cpu_shares: 768
    deploy:
      resources:
        limits: {memory: 2560M}
        reservations: {memory: 1024M}
    stop_grace_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpu_shares: 128
    deploy:
      resources:
        limits: {memory: 384M}
        reservations: {memory: 64M}
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run setup to create .env}
      REDIS_URL: ${REDIS_URL:?Run setup to create .env}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: {memory: 512M}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run setup to create .env}
      REDIS_URL: ${REDIS_URL:?Run setup to create .env}
      # env_file can retain owner opt-in values; base deployment must force remote export off.
      BBD_LANGFUSE_ENABLED: "false"
    init: true
    volumes:
      - app-data:/data
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpu_shares: 1024
    deploy:
      resources:
        limits: {memory: 1G}
        reservations: {memory: 512M}
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["arq", "apps.worker.main.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run setup to create .env}
      REDIS_URL: ${REDIS_URL:?Run setup to create .env}
      # Keep API and worker disabled unless the explicit observability overlay is included.
      BBD_LANGFUSE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "arq", "--check", "apps.worker.main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true
    volumes:
      - app-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpu_shares: 512
    deploy:
      resources:
        limits: {memory: 1G}
        reservations: {memory: 256M}
    stop_grace_period: 30s
    restart: unless-stopped

  chat-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["arq", "apps.worker.main.ChatWorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run setup to create .env}
      REDIS_URL: ${REDIS_URL:?Run setup to create .env}
      BBD_LANGFUSE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "arq", "--check", "apps.worker.main.ChatWorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true
    volumes:
      - app-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpu_shares: 512
    deploy:
      resources:
        limits: {memory: 768M}
        reservations: {memory: 256M}
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/icon.svg"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpu_shares: 512
    deploy:
      resources:
        limits: {memory: 768M}
        reservations: {memory: 256M}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
  redis-data:
