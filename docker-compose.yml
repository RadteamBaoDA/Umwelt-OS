include:
  - docker-compose.base.yml

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Then apply the chat SQL reader password (no-op when CHAT_SQL_READER_DATABASE_URL is unset).
    command: ["sh", "-c", "alembic upgrade head && python -m core.chat_sql_provision"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: {memory: 512M}
    restart: "no"
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      # env_file can retain owner opt-in values; base deployment must force remote export off.
      LANGFUSE_ENABLED: "false"
    init: true
    volumes:
      - app-data:/data
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpu_shares: 1024
    deploy:
      resources:
        limits: {memory: 1G}
        reservations: {memory: 512M}
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["arq", "apps.worker.main.WorkerSettings"]
    env_file: .env
    environment:
      # Keep API and worker disabled unless the explicit observability overlay is included.
      LANGFUSE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "core.worker_healthcheck", "bbd:worker:health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true
    volumes:
      - app-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpu_shares: 512
    deploy:
      resources:
        limits: {memory: 1G}
        reservations: {memory: 256M}
    stop_grace_period: 240s  # >= job_timeout (180) + job_completion_wait margin; SIGTERM drains running jobs
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  cron-worker:
    # Recurring jobs (pollers, recovery, retention) on their own queue/process so they never take
    # ingestion max_jobs slots; every job is lease-guarded, so extra replicas are safe.
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["arq", "apps.worker.main.CronWorkerSettings"]
    env_file: .env
    environment:
      LANGFUSE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "core.worker_healthcheck", "arq:cron:health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true
    volumes:
      - app-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpu_shares: 512
    deploy:
      resources:
        limits: {memory: 512M}
        reservations: {memory: 192M}
    stop_grace_period: 240s  # >= job_timeout (180) + job_completion_wait margin; SIGTERM drains running jobs
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  chat-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["arq", "apps.worker.main.ChatWorkerSettings"]
    env_file: .env
    environment:
      LANGFUSE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "core.worker_healthcheck", "arq:chat:health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true
    volumes:
      - app-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpu_shares: 512
    deploy:
      resources:
        limits: {memory: 768M}
        reservations: {memory: 256M}
    stop_grace_period: 660s  # >= CHAT_JOB_TIMEOUT (600) + 60; SIGTERM drains running jobs
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  model-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["arq", "apps.worker.main.ModelWorkerSettings"]
    env_file: .env
    environment:
      LANGFUSE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "core.worker_healthcheck", "arq:model:health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    init: true
    volumes:
      - app-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    cpu_shares: 512
    deploy:
      resources:
        limits: {memory: 768M}
        reservations: {memory: 256M}
    stop_grace_period: 960s  # >= MODEL_WORKER_JOB_TIMEOUT_SECONDS (900) + 60; raise together
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      # Browser-facing origin; the frame-shell CSP and metadataBase derive from it (request.url is the bind address).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/icon.svg"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpu_shares: 512
    deploy:
      resources:
        limits: {memory: 768M}
        reservations: {memory: 256M}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  app-data:

