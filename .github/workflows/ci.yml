name: CI

# Third-party actions are pinned by version tag, NOT SHA: SHAs could not be verified offline.
# TODO(SHA lookup before enforcing): actions/checkout, astral-sh/setup-uv, actions/setup-node,
# docker/setup-buildx-action, gitleaks/gitleaks-action, aquasecurity/trivy-action,
# github/codeql-action. Resolve with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
# Dependabot (github-actions ecosystem) keeps them current.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_docker_acceptance:
        description: Run docker integration and e2e acceptance (make test)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check core apps modules tests infrastructure/postgres/migrations
      - run: uv run mypy core apps modules
      # Non-docker unit tests: integration tests are gated by BBD_INTEGRATION (unset here).
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --workspace apps/web
      - run: npm run build

  build:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - name: Create disposable CI configuration
        run: |
          cat > .env <<'ENVEOF'
          PUBLIC_ORIGIN=http://localhost:3300
          SECURE_COOKIES=false
          SETUP_TOKEN=bbd-os-disposable-test-token
          CSRF_SIGNING_SECRET=bbd-os-disposable-test-csrf-secret
          SESSION_LIFETIME_HOURS=24
          POSTGRES_PASSWORD=bbd-os-ci-database-only
          DATABASE_URL=postgresql+asyncpg://bbd:bbd-os-ci-database-only@postgres:5432/bbd
          REDIS_URL=redis://redis:6379/0
          DATA_DIR=/data
          WEB_PORT=3300
          ENVEOF
      - run: make build

  acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker_acceptance }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - run: uv sync --frozen
      - run: npm ci
      - name: Create disposable CI configuration
        run: |
          cat > .env <<'ENVEOF'
          PUBLIC_ORIGIN=http://localhost:3300
          SECURE_COOKIES=false
          SETUP_TOKEN=bbd-os-disposable-test-token
          CSRF_SIGNING_SECRET=bbd-os-disposable-test-csrf-secret
          SESSION_LIFETIME_HOURS=24
          POSTGRES_PASSWORD=bbd-os-ci-database-only
          DATABASE_URL=postgresql+asyncpg://bbd:bbd-os-ci-database-only@postgres:5432/bbd
          REDIS_URL=redis://redis:6379/0
          DATA_DIR=/data
          WEB_PORT=3300
          ENVEOF
      - run: make test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit --disable-pip --no-deps -r requirements-audit.txt

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      # Lockfile lives at the repo root (npm workspace), so audit the apps/web workspace from there.
      - run: npm audit --omit=dev --audit-level=high --workspace apps/web

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker build -f infrastructure/docker/api.Dockerfile -t umwelt-api:ci .
      - name: Trivy image scan (api)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: umwelt-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
