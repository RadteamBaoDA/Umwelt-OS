name: CI

# Third-party actions are pinned by commit SHA (tag kept in the trailing comment). Dependabot
# (github-actions ecosystem) keeps the SHAs current.

on:
  push:
  pull_request:
  # Nightly Docker acceptance + k6 smoke (03:17 UTC); PR/push gating is unchanged.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run_docker_acceptance:
        description: Run docker integration and e2e acceptance (make test)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check core apps modules tests scripts
      - run: uv run ruff check core apps modules tests scripts infrastructure/postgres/migrations
      - run: uv run mypy core apps modules
      - name: Function length gate (max 100 lines)
        run: uv run python scripts/check_function_length.py
      - name: File size ratchet (limit 1500 lines)
        run: uv run python scripts/check_file_size.py
      - name: GenUI parity
        run: uv run python scripts/check_genui_parity.py
      - name: Skill mirror (.agents/skills == .claude/skills)
        run: uv run python scripts/sync_skills.py --check
      - name: Import contracts (when configured)
        run: if [ -f .importlinter ]; then uv run lint-imports; else echo "no .importlinter; skipped"; fi
      # Non-docker unit tests: integration tests are gated by INTEGRATION (unset here).
      # Coverage floor (ratchet, see docs/development.md). Tracing slows the timing-sensitive event-loop offload
      # tests past their budgets, so that file runs separately without coverage.
      - run: uv run pytest -q --ignore=tests/unit/test_event_loop_offload.py --cov=core --cov=modules --cov=apps --cov-report=term:skip-covered --cov-fail-under=67
      - run: uv run pytest -q tests/unit/test_event_loop_offload.py

  monitoring-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned to the same tag as docker-compose.monitoring.yml; promtool ships in the Prometheus image.
      - name: promtool check rules and config
        run: |
          printf x > /tmp/metrics_token
          docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /m/alerts.yml
          docker run --rm -v "$PWD/infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"             -v "$PWD/infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"             -v /tmp/metrics_token:/run/secrets/metrics_token:ro             --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /m/alertmanager.yml
      # Synthetic alert routing proof: labels of a real alert (UmweltOutboxPurgeBacklog, severity=ticket) must resolve to
      # the expected receiver; amtool exits non-zero when --verify.receivers does not match the resolved receivers.
      - name: amtool route test (ticket alert reaches owner-webhook)
        run: docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" --entrypoint amtool prom/alertmanager:v0.28.1 config routes test --config.file=/m/alertmanager.yml --verify.receivers=owner-webhook alertname=UmweltOutboxPurgeBacklog severity=ticket
      - name: amtool route test (page alert reaches owner-page)
        run: docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" --entrypoint amtool prom/alertmanager:v0.28.1 config routes test --config.file=/m/alertmanager.yml --verify.receivers=owner-page alertname=UmweltApi5xxRateHigh severity=page
      - name: Synthetic alert delivery (ticket + page reach a stub webhook sink)
        run: bash scripts/alert-delivery-smoke.sh
      - name: promtool unit tests
        run: docker run --rm -v "$PWD/infrastructure/monitoring:/m:ro" -w /m --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts.test.yml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Enforced for files changed in this push/PR: a repo-wide check is blocked until ~55-65 components
      # are split (formatting pushes them over the 100-line eslint budget); see docs/IMPLEMENTATION_STATUS.md.
      - name: Prettier check (changed files)
        run: npm run format:check --workspace apps/web
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      # Coverage floors are in apps/web/vitest.config.ts (ratchet, see docs/development.md).
      - run: npm run test:coverage --workspace apps/web
      - run: npm run build
      - name: Bundle-size budget
        run: npm run check:bundle-size --workspace apps/web
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: OpenAPI types are current
        run: npm run check:api-types

  build:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: npm ci
      - name: Create disposable CI configuration
        run: |
          cat > .env <<'ENVEOF'
          PUBLIC_ORIGIN=http://localhost:3300
          SECURE_COOKIES=false
          SETUP_TOKEN=bbd-os-disposable-test-token
          CSRF_SIGNING_SECRET=bbd-os-disposable-test-csrf-secret
          SESSION_LIFETIME_HOURS=24
          POSTGRES_PASSWORD=bbd-os-ci-database-only
          DATABASE_URL=postgresql+asyncpg://bbd:bbd-os-ci-database-only@postgres:5432/bbd
          REDIS_URL=redis://redis:6379/0
          DATA_DIR=/data
          WEB_PORT=3300
          ENVEOF
      - run: make build

  acceptance:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_docker_acceptance) }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: uv sync --frozen
      - run: npm ci
      - name: Create disposable CI configuration
        run: |
          cat > .env <<'ENVEOF'
          PUBLIC_ORIGIN=http://localhost:3300
          SECURE_COOKIES=false
          SETUP_TOKEN=bbd-os-disposable-test-token
          CSRF_SIGNING_SECRET=bbd-os-disposable-test-csrf-secret
          SESSION_LIFETIME_HOURS=24
          POSTGRES_PASSWORD=bbd-os-ci-database-only
          DATABASE_URL=postgresql+asyncpg://bbd:bbd-os-ci-database-only@postgres:5432/bbd
          REDIS_URL=redis://redis:6379/0
          DATA_DIR=/data
          WEB_PORT=3300
          ENVEOF
      - run: make test

  # Nightly (and manual-acceptance) k6 smoke at 10% scenario length. scripts/load-test.sh builds its own disposable
  # stack, so this does not depend on the acceptance stack being up; it fails the job on any SLO threshold (exit 99).
  load-smoke:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_docker_acceptance) }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Create disposable CI configuration
        run: |
          cat > .env <<'ENVEOF'
          PUBLIC_ORIGIN=http://localhost:3300
          SECURE_COOKIES=false
          SETUP_TOKEN=bbd-os-disposable-test-token
          CSRF_SIGNING_SECRET=bbd-os-disposable-test-csrf-secret
          SESSION_LIFETIME_HOURS=24
          POSTGRES_PASSWORD=bbd-os-ci-database-only
          DATABASE_URL=postgresql+asyncpg://bbd:bbd-os-ci-database-only@postgres:5432/bbd
          REDIS_URL=redis://redis:6379/0
          DATA_DIR=/data
          WEB_PORT=3300
          ENVEOF
      # LOAD_TEST_LIMITS=1 layers the committed docker-compose.limits.yml (2 CPU / 8 GiB split) so the smoke runs under production-like limits.
      # SLO_LATENCY_SCALE=2: shared 2-vCPU runners are slower than the reference host in docs/slo.md.
      - name: k6 smoke against SLO thresholds
        run: LOAD_TEST_LIMITS=1 LOAD_DURATION_SCALE=0.1 SLO_LATENCY_SCALE=2 LOAD_OUT_DIR=test-results/load bash scripts/load-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: k6-smoke
          path: test-results/load

  # Nightly (and manual-acceptance) Lighthouse CI against the disposable compose stack (production web build + API,
  # same `docker-compose.test.yml` override as the acceptance job). Public routes (/, /login, /terms, /privacy) plus
  # the authenticated /dashboard: scripts/lighthouse-auth.cjs (LHCI puppeteerScript, needs puppeteer) creates the owner
  # and signs in before the audit. Accessibility < 0.9 fails the job; performance < 0.8 only warns (lighthouserc.json).
  lighthouse:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_docker_acceptance) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Create disposable CI configuration
        run: |
          cat > .env <<'ENVEOF'
          PUBLIC_ORIGIN=http://localhost:3300
          SECURE_COOKIES=false
          SETUP_TOKEN=bbd-os-disposable-test-token
          CSRF_SIGNING_SECRET=bbd-os-disposable-test-csrf-secret
          SESSION_LIFETIME_HOURS=24
          POSTGRES_PASSWORD=bbd-os-ci-database-only
          DATABASE_URL=postgresql+asyncpg://bbd:bbd-os-ci-database-only@postgres:5432/bbd
          REDIS_URL=redis://redis:6379/0
          DATA_DIR=/data
          WEB_PORT=3300
          ENVEOF
      - name: Start disposable stack
        run: docker compose -p lhci -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
      - run: npx --yes wait-on@8 http://localhost:3300/login --timeout 60000
      - name: Lighthouse CI
        env:
          LH_SETUP_TOKEN: bbd-os-disposable-test-token
          LH_OWNER_PASSWORD: lhci-owner-password-42
        # puppeteerScript requires puppeteer; LHCI resolves it from the global node_modules via NODE_PATH.
        run: |
          npm install --global @lhci/cli@0.16.0 puppeteer@24
          NODE_PATH="$(npm root --global)" lhci autorun
      - name: Stop disposable stack
        if: always()
        run: docker compose -p lhci -f docker-compose.yml -f docker-compose.test.yml down --volumes --remove-orphans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse
          path: test-results/lighthouse

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  make-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      # Single dependency audit: npm audit --audit-level=high (all workspaces, dev included) plus pip-audit over the
      # locked production set (scripts/audit.sh).
      - run: make audit

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
