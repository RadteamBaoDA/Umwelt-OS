services:
  api:
    command: ["uvicorn", "apps.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # --reload runs a single process; the image default of 2 would also demand CSRF_SIGNING_SECRET.
      WEB_CONCURRENCY: "1"
    volumes:
      - ./apps:/app/apps
      - ./core:/app/core
      - ./modules:/app/modules
      - ./infrastructure/postgres/migrations:/app/infrastructure/postgres/migrations

  worker:
    volumes:
      - ./apps:/app/apps
      - ./core:/app/core
      - ./modules:/app/modules

  cron-worker:
    volumes:
      - ./apps:/app/apps
      - ./core:/app/core
      - ./modules:/app/modules

  chat-worker:
    volumes:
      - ./apps:/app/apps
      - ./core:/app/core
      - ./modules:/app/modules

  model-worker:
    volumes:
      - ./apps:/app/apps
      - ./core:/app/core
      - ./modules:/app/modules

  web:
    build:
      target: dependencies
    command: ["npm", "run", "dev", "--workspace", "apps/web"]
    environment:
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - web-node-modules:/app/node_modules
      - web-app-node-modules:/app/apps/web/node_modules

volumes:
  web-node-modules:
  web-app-node-modules:

