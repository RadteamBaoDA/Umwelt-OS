<!-- @dsCard group="Overlays" height=380 subtitle="Quick chat, right side" -->
<div class="ds-sheet-wrap" style="height:380px">
  <div class="ds-sheet" role="dialog" aria-labelledby="t">
    <button class="ds-close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="ds-sheet-header"><h2 class="ds-dialog-title" id="t">Chat</h2><button class="text-button" style="font-size:14px">New chat</button></div>
    <div class="ds-sheet-body">
      <div class="bubble user">What changed in my filings this week?</div>
      <div class="bubble assistant">Two documents were updated on 3 Oct. The Q3 tax draft gained a revised total; the lease renewal added an end date.</div>
    </div>
    <div class="ds-sheet-footer"><input class="input" placeholder="Ask about your workspace"><button class="button">Send</button></div>
  </div>
</div>
