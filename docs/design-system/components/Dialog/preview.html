<!-- @dsCard group="Overlays" height=360 subtitle="User settings — preview until saved" -->
<div class="ds-backdrop">
  <div class="ds-dialog" role="dialog" aria-labelledby="t">
    <button class="ds-close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="ds-dialog-header">
      <h2 class="ds-dialog-title" id="t">User settings</h2>
      <p class="ds-dialog-desc">Changes are previewed until saved.</p>
    </div>
    <div class="theme-options">
      <label class="theme-option"><span class="radio-group-item"></span>Light</label>
      <label class="theme-option is-checked"><span class="radio-group-item" data-state="checked"></span>Dark</label>
      <label class="theme-option"><span class="radio-group-item"></span>System</label>
    </div>
    <div class="ds-dialog-footer"><button class="button secondary">Cancel</button><button class="button">Save</button></div>
  </div>
</div>
